<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日本株 勉強ダッシュボード</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0b101b;
      --panel: #121a2a;
      --panel-2: #182236;
      --border: #26344f;
      --text: #e6edf7;
      --muted: #93a4bf;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --warn-bg: rgba(245, 158, 11, 0.12);
      --warn-border: rgba(245, 158, 11, 0.35);
      --warn-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(18, 26, 42, 0.9);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      height: fit-content;
    }

    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin: 0 0 12px;
    }

    .stock-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stock-btn {
      width: 100%;
      text-align: left;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .stock-btn:hover {
      border-color: #476294;
    }

    .stock-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .stock-code {
      font-size: 0.78rem;
      color: #93c5fd;
      font-weight: 700;
    }

    .stock-name {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .stock-sector {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .main-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .stock-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stock-heading h2 {
      margin: 0;
      font-size: 1.35rem;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .pill {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.78rem;
      color: var(--text);
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      text-decoration: none;
      font-size: 0.84rem;
      font-weight: 600;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .link-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-btn:hover {
      border-color: var(--accent);
    }

    .ctrl-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    .ohlc-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--panel-2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .ohlc-bar strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    #chartContainer {
      width: 100%;
      height: 440px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0d1422;
    }

    @media (max-width: 600px) {
      #chartContainer {
        height: 350px;
      }
    }

    .notice-box {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 0.82rem;
    }

    .notes-section h3 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .notes-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notes-list li {
      color: var(--text);
      font-size: 0.92rem;
    }

    .error-box {
      padding: 14px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1>日本株 勉強ダッシュボード</h1>
        <p>5分〜最大5年チャート操作・ウォッチリスト切替・決算/ニュース確認・メモ共有</p>
      </div>
      <div class="badge">5分 / 1時間 / 1か月 / 1年 / 最大5年</div>
    </div>
  </header>

  <main class="container">
    <aside class="sidebar">
      <h2 class="sidebar-title">登録銘柄（stocks.json）</h2>
      <div id="stockList" class="stock-list"></div>
    </aside>

    <section class="main-stack">
      <div id="statusArea"></div>

      <div class="card">
        <div class="stock-header">
          <div class="stock-heading">
            <h2 id="stockTitle">銘柄を読み込み中...</h2>
            <div class="meta-row">
              <span id="stockSector" class="pill">-</span>
              <span id="stockAddedBy">追加元: -</span>
            </div>
          </div>

          <div class="quick-links">
            <a id="yahooLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">Yahoo!ファイナンス</a>
            <a id="kabutanLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">株探</a>
            <a id="tvLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">TradingViewで開く</a>
            <a id="irLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">公式IR</a>
          </div>
        </div>

        <div class="chart-toolbar">
          <div class="toolbar-group" id="tfGroup">
            <button type="button" class="ctrl-btn" data-tf="5m">5分</button>
            <button type="button" class="ctrl-btn" data-tf="1h">1時間</button>
            <button type="button" class="ctrl-btn active" data-tf="1M">1か月</button>
            <button type="button" class="ctrl-btn" data-tf="1Y">1年</button>
            <button type="button" class="ctrl-btn" data-tf="5Y">最大5年</button>
          </div>

          <div class="toolbar-group" id="modeGroup">
            <button type="button" class="ctrl-btn active" data-mode="candle">ローソク足</button>
            <button type="button" class="ctrl-btn" data-mode="line">終値ライン</button>
            <button type="button" class="ctrl-btn" id="resetZoomBtn">表示リセット</button>
          </div>
        </div>

        <div class="ohlc-bar" id="ohlcBar">
          <span>日時: <strong id="ohlcTime">-</strong></span>
          <span>始値: <strong id="ohlcOpen">-</strong></span>
          <span>高値: <strong id="ohlcHigh">-</strong></span>
          <span>安値: <strong id="ohlcLow">-</strong></span>
          <span>終値: <strong id="ohlcClose">-</strong></span>
        </div>

        <div id="chartContainer"></div>

        <div class="notice-box" id="dataNotice">
          ※ 現在は画面操作・時間足切替の検証用にサンプルデータを表示しています。実データ（日足・分足）を接続する際はデータソースを連携します。
        </div>
      </div>

      <div class="card notes-section">
        <h3>注目ポイント・勉強メモ</h3>
        <ul id="notesList" class="notes-list"></ul>
      </div>
    </section>
  </main>

  <script>
    const TIMEFRAME_META = {
      "5m": { label: "5分足", isIntraday: true },
      "1h": { label: "1時間足", isIntraday: true },
      "1M": { label: "1か月（日足）", isIntraday: false },
      "1Y": { label: "1年（日足）", isIntraday: false },
      "5Y": { label: "最大5年（週足）", isIntraday: false }
    };

    const state = {
      stocks: [],
      selectedIndex: 0,
      timeframe: "1M",
      chartMode: "candle",
      chart: null,
      currentBars: []
    };

    function seedFromCode(code, tf) {
      const str = `${code || "6501"}_${tf || "1M"}`;
      let hash = 2166136261;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return Math.abs(hash >>> 0);
    }

    function formatDateStr(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
      const dd = String(dateObj.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatTimestampLabel(tsSec) {
      const d = new Date(tsSec * 1000);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    // 東証の取引時間（9:00〜11:30、12:30〜15:00、平日）の分足スロットを生成
    function generateIntradayTimestamps(stepMinutes, tradingDaysCount) {
      const slots = [];
      const cursor = new Date();
      cursor.setSeconds(0, 0);

      // 直近の取引日ベースで遡る
      const collectedDays = [];
      const probe = new Date(cursor);
      while (collectedDays.length < tradingDaysCount) {
        const day = probe.getDay();
        if (day !== 0 && day !== 6) {
          collectedDays.push(new Date(probe));
        }
        probe.setDate(probe.getDate() - 1);
      }
      collectedDays.reverse();

      const stepSec = stepMinutes * 60;

      for (const dayDate of collectedDays) {
        // 前場 09:00 - 11:30
        const amStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 9, 0, 0);
        const amEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 11, 30, 0);
        for (let t = Math.floor(amStart.getTime() / 1000); t <= Math.floor(amEnd.getTime() / 1000); t += stepSec) {
          slots.push(t);
        }

        // 後場 12:30 - 15:00
        const pmStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 12, 30, 0);
        const pmEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 15, 0, 0);
        for (let t = Math.floor(pmStart.getTime() / 1000); t <= Math.floor(pmEnd.getTime() / 1000); t += stepSec) {
          slots.push(t);
        }
      }

      return slots;
    }

    function buildBarsFromTimes(times, basePrice, seed, volatilityRatio) {
      let rng = seed || 1234567;
      function nextRand() {
        rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0;
        return rng / 4294967296;
      }

      let price = basePrice;
      const bars = [];

      for (const t of times) {
        const drift = (nextRand() - 0.485) * (price * volatilityRatio);
        const open = Math.max(50, Math.round((price + (nextRand() - 0.5) * (price * 0.004)) * 10) / 10);
        const close = Math.max(50, Math.round((open + drift) * 10) / 10);
        const wickUp = nextRand() * (price * volatilityRatio * 0.7);
        const wickDown = nextRand() * (price * volatilityRatio * 0.7);
        const high = Math.round((Math.max(open, close) + wickUp) * 10) / 10;
        const low = Math.max(20, Math.round((Math.min(open, close) - wickDown) * 10) / 10);

        bars.push({ time: t, open, high, low, close });
        price = close;
      }

      return bars;
    }

    function createSampleBars(stock, tf) {
      const codeSeed = seedFromCode(stock.code, "base");
      const tfSeed = seedFromCode(stock.code, tf);
      const basePrice = 1200 + (codeSeed % 4800);
      const now = new Date();
      now.setHours(0, 0, 0, 0);

      if (tf === "5m") {
        const times = generateIntradayTimestamps(5, 3);
        return buildBarsFromTimes(times, basePrice, tfSeed, 0.006);
      }

      if (tf === "1h") {
        const times = generateIntradayTimestamps(60, 15);
        return buildBarsFromTimes(times, basePrice, tfSeed, 0.012);
      }

      if (tf === "1M") {
        const dates = [];
        for (let i = 30; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() !== 0 && d.getDay() !== 6) {
            dates.push(formatDateStr(d));
          }
        }
        return buildBarsFromTimes(dates, basePrice, tfSeed, 0.022);
      }

      if (tf === "1Y") {
        const dates = [];
        for (let i = 365; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() !== 0 && d.getDay() !== 6) {
            dates.push(formatDateStr(d));
          }
        }
        return buildBarsFromTimes(dates, basePrice, tfSeed, 0.025);
      }

      // "5Y"（最大5年・週足相当）
      const dates = [];
      for (let w = 260; w >= 0; w--) {
        const d = new Date(now);
        d.setDate(now.getDate() - w * 7);
        while (d.getDay() === 0 || d.getDay() === 6) {
          d.setDate(d.getDate() - 1);
        }
        dates.push(formatDateStr(d));
      }
      return buildBarsFromTimes(dates, basePrice, tfSeed, 0.045);
    }

    function formatBarTimeForDisplay(timeVal) {
      if (typeof timeVal === "number") {
        return formatTimestampLabel(timeVal);
      }
      return String(timeVal ?? "-");
    }

    function updateOhlcDisplay(bar) {
      if (!bar) return;
      document.getElementById("ohlcTime").textContent = formatBarTimeForDisplay(bar.time);
      document.getElementById("ohlcOpen").textContent = bar.open !== undefined ? Number(bar.open).toLocaleString("ja-JP") : "-";
      document.getElementById("ohlcHigh").textContent = bar.high !== undefined ? Number(bar.high).toLocaleString("ja-JP") : "-";
      document.getElementById("ohlcLow").textContent = bar.low !== undefined ? Number(bar.low).toLocaleString("ja-JP") : "-";
      document.getElementById("ohlcClose").textContent = bar.close !== undefined ? Number(bar.close).toLocaleString("ja-JP") : "-";
    }

    function ensureChart() {
      const container = document.getElementById("chartContainer");
      if (state.chart) {
        state.chart.remove();
        state.chart = null;
      }

      const tfMeta = TIMEFRAME_META[state.timeframe] || TIMEFRAME_META["1M"];

      const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { type: "solid", color: "#0d1422" },
          textColor: "#cbd5e1"
        },
        grid: {
          vertLines: { color: "rgba(148, 163, 184, 0.1)" },
          horzLines: { color: "rgba(148, 163, 184, 0.1)" }
        },
        crosshair: {
          mode: LightweightCharts.CrosshairMode.Normal
        },
        rightPriceScale: {
          borderColor: "#26344f"
        },
        timeScale: {
          borderColor: "#26344f",
          timeVisible: tfMeta.isIntraday,
          secondsVisible: false
        },
        localization: {
          timeFormatter: (time) => formatBarTimeForDisplay(time)
        }
      });

      if (state.chartMode === "line") {
        const lineSeries = chart.addLineSeries({
          color: "#3b82f6",
          lineWidth: 2
        });
        lineSeries.setData(state.currentBars.map(b => ({ time: b.time, value: b.close })));
      } else {
        const candleSeries = chart.addCandlestickSeries({
          upColor: "#ef4444",
          downColor: "#22c55e",
          borderUpColor: "#ef4444",
          borderDownColor: "#22c55e",
          wickUpColor: "#ef4444",
          wickDownColor: "#22c55e"
        });
        candleSeries.setData(state.currentBars);
      }

      chart.timeScale().fitContent();

      chart.subscribeCrosshairMove(param => {
        if (!param || param.time === undefined) {
          if (state.currentBars.length > 0) {
            updateOhlcDisplay(state.currentBars[state.currentBars.length - 1]);
          }
          return;
        }
        const found = state.currentBars.find(b => b.time === param.time);
        if (found) {
          updateOhlcDisplay(found);
        }
      });

      state.chart = chart;

      if (state.currentBars.length > 0) {
        updateOhlcDisplay(state.currentBars[state.currentBars.length - 1]);
      }
    }

    function renderStockList() {
      const listEl = document.getElementById("stockList");
      listEl.innerHTML = "";

      state.stocks.forEach((stock, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `stock-btn ${idx === state.selectedIndex ? "active" : ""}`;
        btn.innerHTML = `
          <div class="stock-code">${escapeHtml(stock.code)}</div>
          <div class="stock-name">${escapeHtml(stock.name)}</div>
          <div class="stock-sector">${escapeHtml(stock.sector || "未分類")}</div>
        `;
        btn.addEventListener("click", () => {
          state.selectedIndex = idx;
          renderStockList();
          renderSelectedStock();
        });
        listEl.appendChild(btn);
      });
    }

    function getBarsForCurrentSelection(stock, tf) {
      // 将来的に stock.charts[tf]（例: { "5m": [...], "1h": [...], "1M": [...], "1Y": [...], "5Y": [...] }）があれば優先利用
      if (stock.charts && Array.isArray(stock.charts[tf]) && stock.charts[tf].length > 0) {
        return { bars: stock.charts[tf], fromRealData: true };
      }
      return { bars: createSampleBars(stock, tf), fromRealData: false };
    }

    function renderSelectedStock() {
      const stock = state.stocks[state.selectedIndex];
      if (!stock) return;

      document.getElementById("stockTitle").textContent = `${stock.name}（${stock.code}）`;
      document.getElementById("stockSector").textContent = stock.sector || "未分類";
      document.getElementById("stockAddedBy").textContent = `追加元: ${stock.addedBy || "管理者"}`;

      const codeEncoded = encodeURIComponent(stock.code);
      document.getElementById("yahooLink").href = `https://finance.yahoo.co.jp/quote/${codeEncoded}.T`;
      document.getElementById("kabutanLink").href = `https://kabutan.jp/stock/?code=${codeEncoded}`;

      const tvSymbol = stock.tvSymbol ? encodeURIComponent(stock.tvSymbol) : encodeURIComponent(`TSE:${stock.code}`);
      document.getElementById("tvLink").href = `https://jp.tradingview.com/chart/?symbol=${tvSymbol}`;

      const irEl = document.getElementById("irLink");
      if (stock.irUrl) {
        irEl.href = stock.irUrl;
        irEl.style.display = "inline-flex";
      } else {
        irEl.style.display = "none";
      }

      const notesEl = document.getElementById("notesList");
      notesEl.innerHTML = "";
      const notes = Array.isArray(stock.notes) && stock.notes.length > 0
        ? stock.notes
        : [`${stock.name}（${stock.code}）の決算・業績・ニュースをチェック`];

      notes.forEach(note => {
        const li = document.createElement("li");
        li.textContent = note;
        notesEl.appendChild(li);
      });

      const tfMeta = TIMEFRAME_META[state.timeframe] || TIMEFRAME_META["1M"];
      const { bars, fromRealData } = getBarsForCurrentSelection(stock, state.timeframe);
      state.currentBars = bars;

      const noticeEl = document.getElementById("dataNotice");
      if (fromRealData) {
        noticeEl.textContent = `※ ${tfMeta.label}のデータを表示中です。ホイールで拡大・縮小、ドラッグで移動できます。`;
      } else {
        noticeEl.textContent = `※ 「${tfMeta.label}」の操作検証用サンプルを表示中です（ホイールで拡大・縮小、ドラッグで移動できます）。実際の株価データ（分足・日足・長期足）をつなぐ際は、各銘柄データに "${state.timeframe}" 配列を渡すことで差し替えられます。`;
      }

      ensureChart();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function bindControls() {
      document.querySelectorAll("#tfGroup .ctrl-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#tfGroup .ctrl-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.timeframe = btn.dataset.tf;
          renderSelectedStock();
        });
      });

      document.querySelectorAll("#modeGroup .ctrl-btn[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#modeGroup .ctrl-btn[data-mode]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.chartMode = btn.dataset.mode;
          ensureChart();
        });
      });

      document.getElementById("resetZoomBtn").addEventListener("click", () => {
        if (state.chart) {
          state.chart.timeScale().fitContent();
        }
      });

      window.addEventListener("resize", () => {
        const container = document.getElementById("chartContainer");
        if (state.chart && container) {
          state.chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
          });
        }
      });
    }

    async function init() {
      bindControls();
      const statusArea = document.getElementById("statusArea");

      try {
        const res = await fetch(`./stocks.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) {
          throw new Error(`stocks.json の取得に失敗しました（HTTP ${res.status}）`);
        }
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error("stocks.json に銘柄データが見つかりません。");
        }
        state.stocks = data;
        renderStockList();
        renderSelectedStock();
      } catch (err) {
        statusArea.innerHTML = `<div class="error-box">読み込みエラー: ${escapeHtml(err.message)}</div>`;
        document.getElementById("stockTitle").textContent = "データ読み込みエラー";
      }
    }

    init();
  </script>
</body>
</html>
