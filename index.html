<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JPX EQUITY LAB | 日本株リサーチ＆チャート</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f1624;
      --panel-2: #162033;
      --panel-hover: #1c2942;
      --border: #23314d;
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --emerald: #10b981;
      --warn-bg: rgba(245, 158, 11, 0.1);
      --warn-border: rgba(245, 158, 11, 0.3);
      --warn-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: radial-gradient(circle at top right, #111c33 0%, var(--bg) 45%);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* スタイリッシュなブランドヘッダー */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 14, 26, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1340px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      letter-spacing: -0.03em;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      background: linear-gradient(90deg, #ffffff 0%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .primary-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
    }

    .container {
      max-width: 1340px;
      margin: 0 auto;
      padding: 22px 24px;
      display: grid;
      grid-template-columns: 290px 1fr;
      gap: 22px;
    }

    @media (max-width: 920px) {
      .container {
        grid-template-columns: 1fr;
        padding: 16px;
      }
    }

    .sidebar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      height: fit-content;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sidebar-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }

    .count-badge {
      font-size: 0.74rem;
      color: #93c5fd;
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.84rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    .stock-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 68vh;
      overflow-y: auto;
    }

    .stock-btn {
      width: 100%;
      text-align: left;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 11px 13px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .stock-btn:hover {
      background: var(--panel-hover);
      border-color: #3b527e;
    }

    .stock-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .stock-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stock-code {
      font-size: 0.78rem;
      color: #60a5fa;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .stock-name {
      font-size: 0.96rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .stock-sector {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 2px;
    }

    .main-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .stock-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .stock-heading h2 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .pill {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.76rem;
      color: #cbd5e1;
    }

    .quick-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .link-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-btn:hover {
      border-color: var(--accent);
    }

    .ctrl-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    .ohlc-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 8px 14px;
      background: var(--panel-2);
      border-radius: 9px;
      border: 1px solid var(--border);
    }

    .ohlc-bar strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    #chartContainer {
      width: 100%;
      height: 440px;
      border-radius: 11px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0a101d;
    }

    @media (max-width: 600px) {
      #chartContainer {
        height: 340px;
      }
    }

    .notice-box {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      font-size: 0.8rem;
    }

    .notes-section h3 {
      margin: 0 0 12px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .notes-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .notes-list li {
      color: #e2e8f0;
      font-size: 0.92rem;
    }

    /* モーダル（サイト内銘柄追加フォーム） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.1rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--accent);
    }

    .form-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .ghost-btn {
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
      z-index: 60;
      display: none;
    }

    .error-box {
      padding: 14px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">JPX</div>
        <div class="brand-title">
          <h1>JPX EQUITY LAB</h1>
          <span class="brand-tag">Tokyo Market Research</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>SYNCED</span>
        </div>
        <button type="button" class="primary-btn" id="openAddModalBtn">＋ 銘柄を追加</button>
      </div>
    </div>
  </header>

  <main class="container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Watchlist</h2>
        <span class="count-badge" id="stockCount">0</span>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="コード・企業名で絞り込み..." />
      <div id="stockList" class="stock-list"></div>
    </aside>

    <section class="main-stack">
      <div id="statusArea"></div>

      <div class="card">
        <div class="stock-header">
          <div class="stock-heading">
            <h2 id="stockTitle">銘柄を読み込み中...</h2>
            <div class="meta-row">
              <span id="stockSector" class="pill">-</span>
              <span id="stockAddedBy">追加元: -</span>
            </div>
          </div>

          <div class="quick-links">
            <a id="yahooLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">Yahoo!ファイナンス</a>
            <a id="kabutanLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">株探</a>
            <a id="tvLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">TradingView</a>
            <a id="irLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">公式IR</a>
          </div>
        </div>

        <div class="chart-toolbar">
          <div class="toolbar-group" id="tfGroup">
            <button type="button" class="ctrl-btn" data-tf="5m">5分</button>
            <button type="button" class="ctrl-btn" data-tf="1h">1時間</button>
            <button type="button" class="ctrl-btn active" data-tf="1M">1か月</button>
            <button type="button" class="ctrl-btn" data-tf="1Y">1年</button>
            <button type="button" class="ctrl-btn" data-tf="5Y">最大5年</button>
          </div>

          <div class="toolbar-group" id="modeGroup">
            <button type="button" class="ctrl-btn active" data-mode="candle">ローソク足</button>
            <button type="button" class="ctrl-btn" data-mode="line">終値ライン</button>
            <button type="button" class="ctrl-btn" id="resetZoomBtn">表示リセット</button>
          </div>
        </div>

        <div class="ohlc-bar" id="ohlcBar">
          <span>日時: <strong id="ohlcTime">-</strong></span>
          <span>始値: <strong id="ohlcOpen">-</strong></span>
          <span>高値: <strong id="ohlcHigh">-</strong></span>
          <span>安値: <strong id="ohlcLow">-</strong></span>
          <span>終値: <strong id="ohlcClose">-</strong></span>
        </div>

        <div id="chartContainer"></div>

        <div class="notice-box" id="dataNotice">
          ※ チャートはホイールで拡大・縮小、ドラッグで移動できます。
        </div>
      </div>

      <div class="card notes-section">
        <h3>企業概要・決算チェックポイント</h3>
        <ul id="notesList" class="notes-list"></ul>
      </div>
    </section>
  </main>

  <!-- サイト内 銘柄追加モーダル -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>ウォッチリストに銘柄を追加</h3>
        <button type="button" class="close-btn" id="closeAddModalBtn">&times;</button>
      </div>
      <form id="addStockForm">
        <div class="form-group">
          <label for="inputCode">銘柄コード（必須）</label>
          <input type="text" id="inputCode" placeholder="例: 8035" required />
        </div>
        <div class="form-group">
          <label for="inputName">企業名（必須）</label>
          <input type="text" id="inputName" placeholder="例: 東京エレクトロン" required />
        </div>
        <div class="form-group">
          <label for="inputSector">セクター（任意）</label>
          <input type="text" id="inputSector" placeholder="空欄なら自動判定・未分類" />
        </div>
        <div class="form-group">
          <label for="inputNotes">企業概要・決算チェックポイント（任意）</label>
          <textarea id="inputNotes" rows="3" placeholder="空欄のまま送信すると、AIが企業概要と決算チェックポイントを自動作成します"></textarea>
          <div class="form-hint">改行すると複数の箇条書きとして登録されます。</div>
        </div>
        <div class="form-group">
          <label for="inputPasscode">メンバーパスコード（設定時のみ）</label>
          <input type="password" id="inputPasscode" placeholder="管理者から共有されたパスコード" />
        </div>
        <div class="modal-footer">
          <button type="button" class="ghost-btn" id="cancelAddModalBtn">キャンセル</button>
          <button type="submit" class="primary-btn" id="submitStockBtn">追加して同期</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ▼ ここに GAS の「ウェブアプリのURL（.../exec）」を貼り付けてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9uHhYTSemDq2dG0nA30r578ZUDtajrYt-ytklL8Tl72mlZlA_5tvUkYnYtRgDIf5o/exec";

    const TIMEFRAME_META = {
      "5m": { label: "5分足", isIntraday: true },
      "1h": { label: "1時間足", isIntraday: true },
      "1M": { label: "1か月（日足）", isIntraday: false },
      "1Y": { label: "1年（日足）", isIntraday: false },
      "5Y": { label: "最大5年（週足）", isIntraday: false }
    };

    const state = {
      stocks: [],
      filteredIndices: [],
      selectedIndex: 0,
      timeframe: "1M",
      chartMode: "candle",
      chart: null,
      currentBars: []
    };

    function showToast(msg, duration = 4000) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.style.display = "none";
      }, duration);
    }

    function seedFromCode(code, tf) {
      const str = `${code || "6501"}_${tf || "1M"}`;
      let hash = 2166136261;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return Math.abs(hash >>> 0);
    }

    function formatDateStr(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
      const dd = String(dateObj.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatTimestampLabel(tsSec) {
      const d = new Date(tsSec * 1000);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    function generateIntradayTimestamps(stepMinutes, tradingDaysCount) {
      const slots = [];
      const cursor = new Date();
      cursor.setSeconds(0, 0);

      const collectedDays = [];
      const probe = new Date(cursor);
      while (collectedDays.length < tradingDaysCount) {
        const day = probe.getDay();
        if (day !== 0 && day !== 6) {
          collectedDays.push(new Date(probe));
        }
        probe.setDate(probe.getDate() - 1);
      }
      collectedDays.reverse();

      const stepSec = stepMinutes * 60;
      for (const dayDate of collectedDays) {
        const amStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 9, 0, 0);
        const amEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 11, 30, 0);
        for (let t = Math.floor(amStart.getTime() / 1000); t <= Math.floor(amEnd.getTime() / 1000); t += stepSec) {
          slots.push(t);
        }
        const pmStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 12, 30, 0);
        const pmEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 15, 0, 0);
        for (let t = Math.floor(pmStart.getTime() / 1000); t <= Math.floor(pmEnd.getTime() / 1000); t += stepSec) {
          slots.push(t);
        }
      }
      return slots;
    }

    function buildBarsFromTimes(times, basePrice, seed, volatilityRatio) {
      let rng = seed || 1234567;
      function nextRand() {
        rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0;
        return rng / 4294967296;
      }

      let price = basePrice;
      const bars = [];
      for (const t of times) {
        const drift = (nextRand() - 0.485) * (price * volatilityRatio);
        const open = Math.max(50, Math.round((price + (nextRand() - 0.5) * (price * 0.004)) * 10) / 10);
        const close = Math.max(50, Math.round((open + drift) * 10) / 10);
        const wickUp = nextRand() * (price * volatilityRatio * 0.7);
        const wickDown = nextRand() * (price * volatilityRatio * 0.7);
        const high = Math.round((Math.max(open, close) + wickUp) * 10) / 10;
        const low = Math.max(20, Math.round((Math.min(open, close) - wickDown) * 10) / 10);
        bars.push({ time: t, open, high, low, close });
        price = close;
      }
      return bars;
    }

    function createSampleBars(stock, tf) {
      const codeSeed = seedFromCode(stock.code, "base");
      const tfSeed = seedFromCode(stock.code, tf);
      const basePrice = 1200 + (codeSeed % 4800);
      const now = new Date();
      now.setHours(0, 0, 0, 0);

      if (tf === "5m") {
        return buildBarsFromTimes(generateIntradayTimestamps(5, 3), basePrice, tfSeed, 0.006);
      }
      if (tf === "1h") {
        return buildBarsFromTimes(generateIntradayTimestamps(60, 15), basePrice, tfSeed, 0.012);
      }
      if (tf === "1M") {
        const dates = [];
        for (let i = 30; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() !== 0 && d.getDay() !== 6) dates.push(formatDateStr(d));
        }
        return buildBarsFromTimes(dates, basePrice, tfSeed, 0.022);
      }
      if (tf === "1Y") {
        const dates = [];
        for (let i = 365; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() !== 0 && d.getDay() !== 6) dates.push(formatDateStr(d));
        }
        return buildBarsFromTimes(dates, basePrice, tfSeed, 0.025);
      }
      const dates = [];
      for (let w = 260; w >= 0; w--) {
        const d = new Date(now);
        d.setDate(now.getDate() - w * 7);
        while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
        dates.push(formatDateStr(d));
      }
      return buildBarsFromTimes(dates, basePrice, tfSeed, 0.045);
    }

    function formatBarTimeForDisplay(timeVal) {
      return typeof timeVal === "number" ? formatTimestampLabel(timeVal) : String(timeVal ?? "-");
    }

    function updateOhlcDisplay(bar) {
      if (!bar) return;
      document.getElementById("ohlcTime").textContent = formatBarTimeForDisplay(bar.time);
      document.getElementById("ohlcOpen").textContent = bar.open !== undefined ? Number(bar.open).toLocaleString("ja-JP") : "-";
      document.getElementById("ohlcHigh").textContent = bar.high !== undefined ? Number(bar.high).toLocaleString("ja-JP") : "-";
      document.getElementById("ohlcLow").textContent = bar.low !== undefined ? Number(bar.low).toLocaleString("ja-JP") : "-";
      document.getElementById("ohlcClose").textContent = bar.close !== undefined ? Number(bar.close).toLocaleString("ja-JP") : "-";
    }

    function ensureChart() {
      const container = document.getElementById("chartContainer");
      if (state.chart) {
        state.chart.remove();
        state.chart = null;
      }

      const tfMeta = TIMEFRAME_META[state.timeframe] || TIMEFRAME_META["1M"];
      const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { type: "solid", color: "#0a101d" },
          textColor: "#cbd5e1"
        },
        grid: {
          vertLines: { color: "rgba(148, 163, 184, 0.08)" },
          horzLines: { color: "rgba(148, 163, 184, 0.08)" }
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: "#23314d" },
        timeScale: {
          borderColor: "#23314d",
          timeVisible: tfMeta.isIntraday,
          secondsVisible: false
        },
        localization: { timeFormatter: (time) => formatBarTimeForDisplay(time) }
      });

      if (state.chartMode === "line") {
        const lineSeries = chart.addLineSeries({ color: "#3b82f6", lineWidth: 2 });
        lineSeries.setData(state.currentBars.map(b => ({ time: b.time, value: b.close })));
      } else {
        const candleSeries = chart.addCandlestickSeries({
          upColor: "#ef4444",
          downColor: "#22c55e",
          borderUpColor: "#ef4444",
          borderDownColor: "#22c55e",
          wickUpColor: "#ef4444",
          wickDownColor: "#22c55e"
        });
        candleSeries.setData(state.currentBars);
      }

      chart.timeScale().fitContent();
      chart.subscribeCrosshairMove(param => {
        if (!param || param.time === undefined) {
          if (state.currentBars.length > 0) updateOhlcDisplay(state.currentBars[state.currentBars.length - 1]);
          return;
        }
        const found = state.currentBars.find(b => b.time === param.time);
        if (found) updateOhlcDisplay(found);
      });

      state.chart = chart;
      if (state.currentBars.length > 0) updateOhlcDisplay(state.currentBars[state.currentBars.length - 1]);
    }

    function renderStockList() {
      const listEl = document.getElementById("stockList");
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      listEl.innerHTML = "";

      document.getElementById("stockCount").textContent = state.stocks.length;

      state.stocks.forEach((stock, idx) => {
        const hay = `${stock.code} ${stock.name} ${stock.sector || ""}`.toLowerCase();
        if (query && !hay.includes(query)) return;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `stock-btn ${idx === state.selectedIndex ? "active" : ""}`;
        btn.innerHTML = `
          <div class="stock-top">
            <span class="stock-code">${escapeHtml(stock.code)}</span>
          </div>
          <div class="stock-name">${escapeHtml(stock.name)}</div>
          <div class="stock-sector">${escapeHtml(stock.sector || "未分類")}</div>
        `;
        btn.addEventListener("click", () => {
          state.selectedIndex = idx;
          renderStockList();
          renderSelectedStock();
        });
        listEl.appendChild(btn);
      });
    }

    function getBarsForCurrentSelection(stock, tf) {
      if (stock.charts && Array.isArray(stock.charts[tf]) && stock.charts[tf].length > 0) {
        return { bars: stock.charts[tf], fromRealData: true };
      }
      return { bars: createSampleBars(stock, tf), fromRealData: false };
    }

    function renderSelectedStock() {
      const stock = state.stocks[state.selectedIndex];
      if (!stock) return;

      document.getElementById("stockTitle").textContent = `${stock.name}（${stock.code}）`;
      document.getElementById("stockSector").textContent = stock.sector || "未分類";
      document.getElementById("stockAddedBy").textContent = `追加元: ${stock.addedBy || "管理者"}`;

      const codeEncoded = encodeURIComponent(stock.code);
      document.getElementById("yahooLink").href = `https://finance.yahoo.co.jp/quote/${codeEncoded}.T`;
      document.getElementById("kabutanLink").href = `https://kabutan.jp/stock/?code=${codeEncoded}`;
      const tvSymbol = stock.tvSymbol ? encodeURIComponent(stock.tvSymbol) : encodeURIComponent(`TSE:${stock.code}`);
      document.getElementById("tvLink").href = `https://jp.tradingview.com/chart/?symbol=${tvSymbol}`;

      const irEl = document.getElementById("irLink");
      if (stock.irUrl) {
        irEl.href = stock.irUrl;
        irEl.style.display = "inline-flex";
      } else {
        irEl.style.display = "none";
      }

      const notesEl = document.getElementById("notesList");
      notesEl.innerHTML = "";
      const notes = Array.isArray(stock.notes) && stock.notes.length > 0
        ? stock.notes
        : [`${stock.name}（${stock.code}）の決算・業績・ニュースをチェック`];

      notes.forEach(note => {
        const li = document.createElement("li");
        li.textContent = note;
        notesEl.appendChild(li);
      });

      const tfMeta = TIMEFRAME_META[state.timeframe] || TIMEFRAME_META["1M"];
      const { bars, fromRealData } = getBarsForCurrentSelection(stock, state.timeframe);
      state.currentBars = bars;

      const noticeEl = document.getElementById("dataNotice");
      noticeEl.textContent = fromRealData
        ? `※ ${tfMeta.label}の実データを表示中です（ホイールで拡大・縮小、ドラッグで移動）。`
        : `※ 「${tfMeta.label}」のプレビュー波形を表示中です（ホイールで拡大・縮小、ドラッグで移動）。`;

      ensureChart();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function bindModalAndForm() {
      const modal = document.getElementById("addModal");
      const openBtn = document.getElementById("openAddModalBtn");
      const closeBtn = document.getElementById("closeAddModalBtn");
      const cancelBtn = document.getElementById("cancelAddModalBtn");
      const form = document.getElementById("addStockForm");
      const submitBtn = document.getElementById("submitStockBtn");

      const closeModal = () => modal.classList.remove("open");
      openBtn.addEventListener("click", () => modal.classList.add("open"));
      closeBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => {
        if (e.target === modal) closeModal();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!GAS_WEB_APP_URL) {
          alert("index.html 内の GAS_WEB_APP_URL にデプロイURLを設定してください。");
          return;
        }

        const code = document.getElementById("inputCode").value.trim();
        const name = document.getElementById("inputName").value.trim();
        const sector = document.getElementById("inputSector").value.trim();
        const noteText = document.getElementById("inputNotes").value.trim();
        const passcode = document.getElementById("inputPasscode").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = "同期中...";

        try {
          const res = await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ code, name, sector, noteText, passcode, addedBy: "メンバー" })
          });
          const data = await res.json();
          if (!data.ok) {
            throw new Error(data.error || "追加に失敗しました。");
          }

          // 画面上のリストにも即時反映（GitHub Pages再ビルド前でもすぐ見れる）
          const existingIdx = state.stocks.findIndex(s => String(s.code) === String(data.stock.code));
          if (existingIdx >= 0) {
            state.stocks[existingIdx] = data.stock;
            state.selectedIndex = existingIdx;
          } else {
            state.stocks.push(data.stock);
            state.selectedIndex = state.stocks.length - 1;
          }

          renderStockList();
          renderSelectedStock();
          form.reset();
          closeModal();
          showToast(`「${data.stock.name}（${data.stock.code}）」を追加し、GitHubと同期しました！`);
        } catch (err) {
          alert("エラー: " + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "追加して同期";
        }
      });
    }

    function bindControls() {
      document.getElementById("searchInput").addEventListener("input", renderStockList);

      document.querySelectorAll("#tfGroup .ctrl-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#tfGroup .ctrl-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.timeframe = btn.dataset.tf;
          renderSelectedStock();
        });
      });

      document.querySelectorAll("#modeGroup .ctrl-btn[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#modeGroup .ctrl-btn[data-mode]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.chartMode = btn.dataset.mode;
          ensureChart();
        });
      });

      document.getElementById("resetZoomBtn").addEventListener("click", () => {
        if (state.chart) state.chart.timeScale().fitContent();
      });

      window.addEventListener("resize", () => {
        const container = document.getElementById("chartContainer");
        if (state.chart && container) {
          state.chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
          });
        }
      });
    }

    async function init() {
      bindControls();
      bindModalAndForm();
      const statusArea = document.getElementById("statusArea");

      try {
        const res = await fetch(`./stocks.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`stocks.json の取得に失敗しました（HTTP ${res.status}）`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error("stocks.json に銘柄データが見つかりません。");
        state.stocks = data;
        renderStockList();
        renderSelectedStock();
      } catch (err) {
        statusArea.innerHTML = `<div class="error-box">読み込みエラー: ${escapeHtml(err.message)}</div>`;
        document.getElementById("stockTitle").textContent = "データ読み込みエラー";
      }
    }

    init();
  </script>
</body>
</html>
