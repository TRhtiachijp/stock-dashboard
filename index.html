<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JONASAN KABU (JNK)</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" href="./icon-180.png">
  <meta name="apple-mobile-web-app-title" content="JNK">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f1624;
      --panel-2: #162033;
      --border: #23314d;
      --text: #f1f5f9;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --pdf-accent: #f59e0b;
      --pdf-soft: rgba(245, 158, 11, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 14, 26, 0.92);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.78rem;
      color: #fff;
      letter-spacing: -0.02em;
    }

    .brand h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #fff;
    }

    .primary-btn {
      padding: 7px 13px;
      border-radius: 9px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .selector-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .stock-select {
      flex: 1;
      min-width: 185px;
      padding: 9px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.94rem;
      font-weight: 700;
      outline: none;
    }

    .stock-select:focus {
      border-color: var(--accent);
    }

    .meta-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .pill {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 0.74rem;
      color: var(--muted);
    }

    .pdf-btn {
      padding: 6px 11px;
      border-radius: 8px;
      border: 1px solid rgba(245, 158, 11, 0.45);
      background: var(--pdf-soft);
      color: #fcd34d;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .link-btn {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: #93c5fd;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 8px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .ctrl-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 9px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    .ctrl-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: #93c5fd;
    }

    .ohlc-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 8px;
      padding: 6px 10px;
      background: var(--panel-2);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .ohlc-bar strong {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    #chartContainer {
      width: 100%;
      height: 360px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #0a101d;
    }

    @media (max-width: 640px) {
      #chartContainer {
        height: 235px;
      }
    }

    .notes-section h3 {
      margin: 0 0 8px;
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    .notes-list {
      margin: 0;
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .notes-list li {
      color: #e2e8f0;
      font-size: 0.86rem;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1rem;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
    }

    .form-hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 5px;
    }

    details.optional-box {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 10px;
      background: rgba(22, 32, 51, 0.5);
    }

    details.optional-box summary {
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      font-weight: 600;
    }

    details.optional-box .inner {
      margin-top: 10px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }

    .ghost-btn {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 9px;
      background: #1e293b;
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 60;
      display: none;
      max-width: 92vw;
      text-align: center;
    }

    .error-box {
      padding: 12px;
      border-radius: 9px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">JNK</div>
        <h1>JONASAN KABU (JNK)</h1>
      </div>
      <button type="button" class="primary-btn" id="openAddModalBtn">＋ 追加</button>
    </div>
  </header>

  <main class="container">
    <div id="statusArea"></div>

    <div class="card">
      <div class="selector-row">
        <select id="stockSelect" class="stock-select" aria-label="銘柄を選択"></select>
        <div class="meta-badges">
          <span id="stockSector" class="pill">-</span>
          <a id="pdfIrLink" class="pdf-btn" href="#" target="_blank" rel="noopener noreferrer">決算PDF・IR</a>
          <a id="yahooLink" class="link-btn" href="#" target="_blank" rel="noopener noreferrer">Yahoo!</a>
        </div>
      </div>

      <div class="chart-toolbar">
        <div class="toolbar-group" id="tfGroup">
          <button type="button" class="ctrl-btn" data-tf="5m">5m</button>
          <button type="button" class="ctrl-btn" data-tf="1h">1h</button>
          <button type="button" class="ctrl-btn active" data-tf="1M">1M</button>
          <button type="button" class="ctrl-btn" data-tf="1Y">1Y</button>
          <button type="button" class="ctrl-btn" data-tf="5Y">5Y</button>
        </div>

        <div class="toolbar-group" id="modeGroup">
          <button type="button" class="ctrl-btn active" data-mode="candle">ローソク</button>
          <button type="button" class="ctrl-btn" data-mode="line">ライン</button>
        </div>
      </div>

      <div class="ohlc-bar">
        <span>日時: <strong id="ohlcTime">-</strong></span>
        <span>始: <strong id="ohlcOpen">-</strong></span>
        <span>高: <strong id="ohlcHigh">-</strong></span>
        <span>安: <strong id="ohlcLow">-</strong></span>
        <span>終: <strong id="ohlcClose">-</strong></span>
      </div>

      <div id="chartContainer"></div>
    </div>

    <div class="card notes-section">
      <h3>企業概要・チェックポイント</h3>
      <ul id="notesList" class="notes-list"></ul>
    </div>
  </main>

  <!-- 銘柄コードのみで追加できるモーダル -->
  <div class="modal-backdrop" id="addModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>銘柄を追加</h3>
        <button type="button" class="close-btn" id="closeAddModalBtn">&times;</button>
      </div>
      <form id="addStockForm">
        <div class="form-group">
          <label for="inputCode">銘柄コード（これだけでOK）</label>
          <input type="text" id="inputCode" inputmode="text" placeholder="例: 8035 または 285A" required />
          <div class="form-hint">企業名・業種・決算PDF/IRリンク・概要は自動取得されます。</div>
        </div>

        <details class="optional-box">
          <summary>手動で指定したい場合（任意）</summary>
          <div class="inner">
            <div class="form-group">
              <label for="inputName">企業名</label>
              <input type="text" id="inputName" placeholder="空欄なら自動取得" />
            </div>
            <div class="form-group">
              <label for="inputIrUrl">決算PDF / IR URL</label>
              <input type="url" id="inputIrUrl" placeholder="https://...（空欄なら自動取得）" />
            </div>
            <div class="form-group">
              <label for="inputNotes">メモ</label>
              <textarea id="inputNotes" rows="2" placeholder="空欄なら自動作成"></textarea>
            </div>
          </div>
        </details>

        <div class="modal-footer">
          <button type="button" class="ghost-btn" id="cancelAddModalBtn">閉じる</button>
          <button type="submit" class="primary-btn" id="submitStockBtn">追加する</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ▼ ここに GAS の「ウェブアプリのURL（.../exec）」を貼り付けてください
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby9uHhYTSemDq2dG0nA30r578ZUDtajrYt-ytklL8Tl72mlZlA_5tvUkYnYtRgDIf5o/exec";

    const TIMEFRAME_META = {
      "5m": { isIntraday: true },
      "1h": { isIntraday: true },
      "1M": { isIntraday: false },
      "1Y": { isIntraday: false },
      "5Y": { isIntraday: false }
    };

    const state = {
      stocks: [],
      selectedIndex: 0,
      timeframe: "1M",
      chartMode: "candle",
      chart: null,
      currentBars: []
    };

    function showToast(msg, duration = 3500) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.style.display = "none"; }, duration);
    }

    function seedFromCode(code, tf) {
      const str = `${code || "6501"}_${tf || "1M"}`;
      let hash = 2166136261;
      for (let i = 0; i < str.length; i++) {
        hash ^= str.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return Math.abs(hash >>> 0);
    }

    function formatDateStr(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
      const dd = String(dateObj.getDate()).padStart(2, "0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatTimestampLabel(tsSec) {
      const d = new Date(tsSec * 1000);
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${mm}/${dd} ${hh}:${min}`;
    }

    function generateIntradayTimestamps(stepMinutes, tradingDaysCount) {
      const slots = [];
      const cursor = new Date();
      cursor.setSeconds(0, 0);

      const collectedDays = [];
      const probe = new Date(cursor);
      while (collectedDays.length < tradingDaysCount) {
        const day = probe.getDay();
        if (day !== 0 && day !== 6) collectedDays.push(new Date(probe));
        probe.setDate(probe.getDate() - 1);
      }
      collectedDays.reverse();

      const stepSec = stepMinutes * 60;
      for (const dayDate of collectedDays) {
        const amStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 9, 0, 0);
        const amEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 11, 30, 0);
        for (let t = Math.floor(amStart.getTime() / 1000); t <= Math.floor(amEnd.getTime() / 1000); t += stepSec) {
          slots.push(t);
        }
        const pmStart = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 12, 30, 0);
        const pmEnd = new Date(dayDate.getFullYear(), dayDate.getMonth(), dayDate.getDate(), 15, 0, 0);
        for (let t = Math.floor(pmStart.getTime() / 1000); t <= Math.floor(pmEnd.getTime() / 1000); t += stepSec) {
          slots.push(t);
        }
      }
      return slots;
    }

    function buildBarsFromTimes(times, basePrice, seed, volatilityRatio) {
      let rng = seed || 1234567;
      function nextRand() {
        rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0;
        return rng / 4294967296;
      }

      let price = basePrice;
      const bars = [];
      for (const t of times) {
        const drift = (nextRand() - 0.485) * (price * volatilityRatio);
        const open = Math.max(50, Math.round(price + (nextRand() - 0.5) * (price * 0.004)));
        const close = Math.max(50, Math.round(open + drift));
        const wickUp = nextRand() * (price * volatilityRatio * 0.7);
        const wickDown = nextRand() * (price * volatilityRatio * 0.7);
        const high = Math.round(Math.max(open, close) + wickUp);
        const low = Math.max(20, Math.round(Math.min(open, close) - wickDown));
        bars.push({ time: t, open, high, low, close });
        price = close;
      }
      return bars;
    }

    function createSampleBars(stock, tf) {
      const codeSeed = seedFromCode(stock.code, "base");
      const tfSeed = seedFromCode(stock.code, tf);
      // 日本株の株価水準（6501 日立製作所は4,000円前後、その他は2,000〜9,000円台の整数）
      const basePrice = String(stock.code).toUpperCase() === "6501" ? 4000 : 2000 + (codeSeed % 8000);
      const now = new Date();
      now.setHours(0, 0, 0, 0);

      if (tf === "5m") return buildBarsFromTimes(generateIntradayTimestamps(5, 3), basePrice, tfSeed, 0.006);
      if (tf === "1h") return buildBarsFromTimes(generateIntradayTimestamps(60, 15), basePrice, tfSeed, 0.012);
      if (tf === "1M") {
        const dates = [];
        for (let i = 30; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() !== 0 && d.getDay() !== 6) dates.push(formatDateStr(d));
        }
        return buildBarsFromTimes(dates, basePrice, tfSeed, 0.022);
      }
      if (tf === "1Y") {
        const dates = [];
        for (let i = 365; i >= 0; i--) {
          const d = new Date(now);
          d.setDate(now.getDate() - i);
          if (d.getDay() !== 0 && d.getDay() !== 6) dates.push(formatDateStr(d));
        }
        return buildBarsFromTimes(dates, basePrice, tfSeed, 0.025);
      }
      const dates = [];
      for (let w = 260; w >= 0; w--) {
        const d = new Date(now);
        d.setDate(now.getDate() - w * 7);
        while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
        dates.push(formatDateStr(d));
      }
      return buildBarsFromTimes(dates, basePrice, tfSeed, 0.045);
    }

    function formatBarTimeForDisplay(timeVal) {
      return typeof timeVal === "number" ? formatTimestampLabel(timeVal) : String(timeVal ?? "-");
    }

    function formatYen(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "-";
      return `${Math.round(num).toLocaleString("ja-JP")}円`;
    }

    const YEN_PRICE_FORMAT = { type: "custom", formatter: (price) => formatYen(price), minMove: 1 };

    function updateOhlcDisplay(bar) {
      if (!bar) return;
      document.getElementById("ohlcTime").textContent = formatBarTimeForDisplay(bar.time);
      document.getElementById("ohlcOpen").textContent = bar.open !== undefined ? formatYen(bar.open) : "-";
      document.getElementById("ohlcHigh").textContent = bar.high !== undefined ? formatYen(bar.high) : "-";
      document.getElementById("ohlcLow").textContent = bar.low !== undefined ? formatYen(bar.low) : "-";
      document.getElementById("ohlcClose").textContent = bar.close !== undefined ? formatYen(bar.close) : "-";
    }

    function ensureChart() {
      const container = document.getElementById("chartContainer");
      if (state.chart) {
        state.chart.remove();
        state.chart = null;
      }

      const tfMeta = TIMEFRAME_META[state.timeframe] || TIMEFRAME_META["1M"];
      const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
          background: { type: "solid", color: "#0a101d" },
          textColor: "#cbd5e1",
          fontSize: 11
        },
        grid: {
          vertLines: { color: "rgba(148, 163, 184, 0.08)" },
          horzLines: { color: "rgba(148, 163, 184, 0.08)" }
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: "#23314d" },
        timeScale: {
          borderColor: "#23314d",
          timeVisible: tfMeta.isIntraday,
          secondsVisible: false
        },
        localization: {
          locale: "ja-JP",
          timeFormatter: (time) => formatBarTimeForDisplay(time),
          priceFormatter: (price) => formatYen(price)
        }
      });

      if (state.chartMode === "line") {
        const lineSeries = chart.addLineSeries({ color: "#3b82f6", lineWidth: 2, priceFormat: YEN_PRICE_FORMAT });
        lineSeries.setData(state.currentBars.map(b => ({ time: b.time, value: b.close })));
      } else {
        const candleSeries = chart.addCandlestickSeries({
          upColor: "#ef4444",
          downColor: "#22c55e",
          borderUpColor: "#ef4444",
          borderDownColor: "#22c55e",
          wickUpColor: "#ef4444",
          wickDownColor: "#22c55e",
          priceFormat: YEN_PRICE_FORMAT
        });
        candleSeries.setData(state.currentBars);
      }

      chart.timeScale().fitContent();
      chart.subscribeCrosshairMove(param => {
        if (!param || param.time === undefined) {
          if (state.currentBars.length > 0) updateOhlcDisplay(state.currentBars[state.currentBars.length - 1]);
          return;
        }
        const found = state.currentBars.find(b => b.time === param.time);
        if (found) updateOhlcDisplay(found);
      });

      state.chart = chart;
      if (state.currentBars.length > 0) updateOhlcDisplay(state.currentBars[state.currentBars.length - 1]);
    }

    function renderStockSelect() {
      const selectEl = document.getElementById("stockSelect");
      selectEl.innerHTML = "";
      state.stocks.forEach((stock, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.textContent = `${stock.code}  ${stock.name}`;
        if (idx === state.selectedIndex) opt.selected = true;
        selectEl.appendChild(opt);
      });
    }

    function renderSelectedStock() {
      const stock = state.stocks[state.selectedIndex];
      if (!stock) return;

      const codeEncoded = encodeURIComponent(stock.code);
      document.getElementById("stockSector").textContent = stock.sector || "未分類";
      document.getElementById("yahooLink").href = `https://finance.yahoo.co.jp/quote/${codeEncoded}.T`;

      // irUrl があればそれを開き、無ければYahoo!ファイナンスの決算・適時開示（PDF一覧）へ遷移
      const pdfUrl = stock.irUrl || `https://finance.yahoo.co.jp/quote/${codeEncoded}.T/disclosure`;
      document.getElementById("pdfIrLink").href = pdfUrl;

      const notesEl = document.getElementById("notesList");
      notesEl.innerHTML = "";
      const notes = Array.isArray(stock.notes) && stock.notes.length > 0
        ? stock.notes
        : [`${stock.name}（${stock.code}）の決算・業績・ニュースをチェック`];

      notes.forEach(note => {
        const li = document.createElement("li");
        li.textContent = note;
        notesEl.appendChild(li);
      });

      if (stock.charts && Array.isArray(stock.charts[state.timeframe]) && stock.charts[state.timeframe].length > 0) {
        state.currentBars = stock.charts[state.timeframe];
      } else {
        state.currentBars = createSampleBars(stock, state.timeframe);
      }

      ensureChart();
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function bindModalAndForm() {
      const modal = document.getElementById("addModal");
      const openBtn = document.getElementById("openAddModalBtn");
      const closeBtn = document.getElementById("closeAddModalBtn");
      const cancelBtn = document.getElementById("cancelAddModalBtn");
      const form = document.getElementById("addStockForm");
      const submitBtn = document.getElementById("submitStockBtn");

      const closeModal = () => modal.classList.remove("open");
      openBtn.addEventListener("click", () => {
        modal.classList.add("open");
        setTimeout(() => document.getElementById("inputCode").focus(), 50);
      });
      closeBtn.addEventListener("click", closeModal);
      cancelBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!GAS_WEB_APP_URL) {
          alert("index.html 内の GAS_WEB_APP_URL にURLを設定してください。");
          return;
        }

        const code = document.getElementById("inputCode").value.trim().toUpperCase();
        if (!code) {
          alert("銘柄コードを入力してください。");
          return;
        }
        const name = document.getElementById("inputName").value.trim();
        const irUrl = document.getElementById("inputIrUrl").value.trim();
        const noteText = document.getElementById("inputNotes").value.trim();

        submitBtn.disabled = true;
        submitBtn.textContent = "自動取得・追加中...";

        try {
          const res = await fetch(GAS_WEB_APP_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ code, name, irUrl, noteText, addedBy: "メンバー" })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "追加に失敗しました。");

          const existingIdx = state.stocks.findIndex(s => String(s.code) === String(data.stock.code));
          if (existingIdx >= 0) {
            state.stocks[existingIdx] = data.stock;
            state.selectedIndex = existingIdx;
          } else {
            state.stocks.push(data.stock);
            state.selectedIndex = state.stocks.length - 1;
          }

          renderStockSelect();
          renderSelectedStock();
          form.reset();
          closeModal();
          showToast(`${data.stock.name}（${data.stock.code}）を追加しました`);
        } catch (err) {
          alert("エラー: " + err.message);
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = "追加する";
        }
      });
    }

    function bindControls() {
      document.getElementById("stockSelect").addEventListener("change", (e) => {
        state.selectedIndex = Number(e.target.value) || 0;
        renderSelectedStock();
      });

      document.querySelectorAll("#tfGroup .ctrl-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#tfGroup .ctrl-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.timeframe = btn.dataset.tf;
          renderSelectedStock();
        });
      });

      document.querySelectorAll("#modeGroup .ctrl-btn[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("#modeGroup .ctrl-btn[data-mode]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.chartMode = btn.dataset.mode;
          ensureChart();
        });
      });

      window.addEventListener("resize", () => {
        const container = document.getElementById("chartContainer");
        if (state.chart && container) {
          state.chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
          });
        }
      });
    }

    async function init() {
      bindControls();
      bindModalAndForm();
      const statusArea = document.getElementById("statusArea");

      try {
        const res = await fetch(`./stocks.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`stocks.json の取得に失敗しました（HTTP ${res.status}）`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) throw new Error("stocks.json に銘柄データが見つかりません。");
        state.stocks = data;
        renderStockSelect();
        renderSelectedStock();
      } catch (err) {
        statusArea.innerHTML = `<div class="error-box">読み込みエラー: ${escapeHtml(err.message)}</div>`;
      }
    }

    init();
  </script>
</body>
</html>
